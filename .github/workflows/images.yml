name: Vérifier les images

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Début du code des séries à vérifier (ex. Ffp) ; vide = séries pas encore vérifiées"
        type: string
        default: ""

permissions:
  contents: write

# jamais en même temps que l'import et les prix (mêmes fichiers de données)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Images des cartes
        run: |
          if [ -n "${{ inputs.series }}" ]; then node scripts/check-images.mjs --sets "${{ inputs.series }}"; else node scripts/check-images.mjs --minutes 45; fi
      - name: Enregistrer
        run: |
          git config user.name "weissdex-bot"
          git config user.email "weissdex-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Images vérifiées le $(date +%F)"
          git pull --rebase -X theirs origin main && git push
