<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeissDex</title>
  <meta name="description" content="Suivi de collection Weiss Schwarz en anglais et en japonais : cartes, prix Cardmarket et courbes de prix.">
  <meta name="theme-color" content="#0d0d11">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <div class="demo-banner" id="demoBanner" hidden>
      Données d'essai : quelques séries seulement. Lancez l'import (GitHub → Actions → Run workflow, case « nouveautés ») pour toutes les cartes.
    </div>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Navigation principale">
    <div class="brand pc-only" aria-hidden="true"><svg viewBox="0 0 512 512"><defs><linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8455a"/><stop offset="1" stop-color="#f2b53a"/></linearGradient></defs><rect width="512" height="512" rx="110" fill="#0d0d11"/><rect x="118" y="112" width="190" height="282" rx="22" fill="#f5f1e8" transform="rotate(-11 213 253)"/><rect x="204" y="118" width="190" height="282" rx="22" fill="#16161b" stroke="url(#brandg)" stroke-width="10" transform="rotate(11 299 259)"/><path d="M168 206l40 122 48-86 48 86 40-122" fill="none" stroke="url(#brandg)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg>WeissDex</div>
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="#collection" data-tab="collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="12" height="17" rx="2"/><path d="M19 6v14a1 1 0 0 1-1 1H8"/></svg>
      <span>Collection</span>
    </a>
    <a href="#search" data-tab="search" class="tab-main" aria-label="Rechercher une carte">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <span>Recherche</span>
    </a>
    <a href="#values" data-tab="values">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18"/><path d="m4 15 5-5 4 3 7-7"/><path d="M15 6h5v5"/></svg>
      <span>Cotes</span>
    </a>
    <a href="#wishlist" data-tab="wishlist">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <span>Souhaits</span>
    </a>
    <a href="#friends" data-tab="friends" class="pc-only">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M15.5 14.2A5.5 5.5 0 0 1 21.5 20"/></svg>
      <span>Amis</span><b class="fbadge" data-friends-badge hidden></b>
    </a>
  </nav>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" id="sheetPanel"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
